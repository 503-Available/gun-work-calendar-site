    go.disabled = true;
    return;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    go.disabled = true;
    msg.textContent = '여는 중…';
    try {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw.value), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', hash: 'SHA-256', salt: bytes(P.salt), iterations: P.iter },
        base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(P.iv) }, key, bytes(P.ct));
      const app = JSON.parse(new TextDecoder().decode(plain));
      window.__wcPass = pw.value;
      document.title = '업무 일정표';
      const style = document.createElement('style');
      style.textContent = app.css;
      document.head.appendChild(style);
      document.body.style.cssText = 'display:block;padding:0';
      document.body.innerHTML = app.html;
      const script = document.createElement('script');
      script.textContent = app.js;
      document.body.appendChild(script);
    } catch (err) {
      msg.textContent = '비밀번호가 올바르지 않습니다.';
      go.disabled = false;
      pw.select();
    }
  });
})();
</script>
